<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTogether - 一块游戏</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#ec4899',
                        dark: '#0f172a',
                        darkLight: '#1e293b',
                        neon: '#06b6d4',
                        switch: '#8b5cf6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .text-shadow {
                text-shadow: 0 0 10px rgba(6, 182, 212, 0.7);
            }
            .text-shadow-lg {
                text-shadow: 0 0 20px rgba(6, 182, 212, 0.9), 0 0 30px rgba(6, 182, 212, 0.6);
            }
            .text-shadow-switch {
                text-shadow: 0 0 20px rgba(139, 92, 246, 0.9), 0 0 30px rgba(139, 92, 246, 0.6);
            }
            .glow {
                box-shadow: 0 0 15px rgba(6, 182, 212, 0.7);
            }
            .glow-hover {
                box-shadow: 0 0 22px rgba(6, 182, 212, 0.45), 0 0 35px rgba(6, 182, 212, 0.2);
            }
            .glow-secondary-hover {
                box-shadow: 0 0 22px rgba(236, 72, 153, 0.45), 0 0 35px rgba(236, 72, 153, 0.2);
            }
            .glow-primary-hover {
                box-shadow: 0 0 22px rgba(99, 102, 241, 0.45), 0 0 35px rgba(99, 102, 241, 0.2);
            }
            .glow-switch {
                box-shadow: 0 0 25px rgba(139, 92, 246, 0.8);
            }
            .glow-switch-hover {
                box-shadow: 0 0 28px rgba(139, 92, 246, 0.48), 0 0 45px rgba(139, 92, 246, 0.22);
            }
            .card-hover {
                transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            }
            .bg-gradient-game {
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            }
            .bg-card-overlay {
                background: linear-gradient(to top, rgba(15, 23, 42, 0.92) 0%, rgba(15, 23, 42, 0.35) 60%, rgba(15, 23, 42, 0.6) 100%);
                transition: opacity 0.4s ease;
            }
            .ripple {
                position: relative;
                overflow: hidden;
            }
            .ripple:after {
                content: "";
                display: block;
                position: absolute;
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                pointer-events: none;
                background-image: radial-gradient(circle, #fff 10%, transparent 10.01%);
                background-repeat: no-repeat;
                background-position: 50%;
                transform: scale(10, 10);
                opacity: 0;
                transition: transform 0.5s, opacity 0.8s;
            }
            .ripple:active:after {
                transform: scale(0, 0);
                opacity: 0.3;
                transition: 0s;
            }
        }
    </style>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4f46e5;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        .card {
            position: relative;
            overflow: hidden;
        }
        /* 悬浮时遮罩变淡，图片原生色彩完全显示 */
        .card:hover .bg-card-overlay {
            opacity: 0.25;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, transparent 70%);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .card.switch-card::before {
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
        }

        .card:hover::before {
            animation: shine 1.5s ease;
            opacity: 1;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) rotate(45deg);
            }
        }

        main {
            position: relative;
            z-index: 1;
        }

        /* 标题、副标题、按钮统一向1点钟方向放大 */
        .card h2,
        .card p,
        .card button {
            transition: transform 0.3s ease;
            transform-origin: left top;
        }

        .card:hover h2,
        .card:hover p,
        .card:hover button {
            transform: scale(1.05) translateX(4px) translateY(-4px);
        }
    </style>
</head>
<body class="bg-gradient-game min-h-screen text-white font-sans">
    <div id="particles-js"></div>

    <!-- 主体容器，Logo普通文档流，不悬浮 -->
    <main class="container mx-auto pt-6 pb-20 px-6 md:px-12">
        <!-- 页面左上角普通标题，滚动跟随消失 -->
        <div class="flex items-center space-x-2 mb-8">
            <img src="https://pic1.imgdb.cn/item/69cfa72edf10edaed90f7072.png" alt="GameVerse Logo" class="h-8 w-8 object-cover rounded-md">
            <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-neon to-secondary text-shadow">一块游戏</span>
        </div>

        <div class="text-center mb-8" data-aos="fade-up" data-aos-duration="1000">
            <h1 class="text-3xl md:text-5xl font-bold mb-3 bg-clip-text text-transparent bg-gradient-to-r from-neon via-switch to-secondary text-shadow-lg">
                探索游戏世界
            </h1>
            <p class="text-base md:text-lg text-gray-300 max-w-3xl mx-auto">
                单机 / ACG / 复古模拟器 / Switch掌机，一站式游戏资源平台
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-8">
            <!-- 单机游戏 -->
            <div id="single-player" class="card card-hover rounded-xl overflow-hidden h-[480px] glow hover:glow-hover" data-aos="fade-up" data-aos-delay="100" data-aos-duration="1000">
                <div class="relative h-full">
                    <img src="https://pic1.imgdb.cn/item/69cfa592df10edaed90f68ef.jpg" alt="单机游戏" class="absolute inset-0 w-full h-full object-cover">
                    <!-- 渐变遮罩，hover自动变淡 -->
                    <div class="absolute inset-0 bg-card-overlay"></div>
                    <div class="absolute inset-0 flex flex-col justify-end p-8">
                        <h2 class="text-4xl font-bold mb-4 text-shadow">单机游戏</h2>
                        <p class="text-gray-300 mb-6">探索最新热门3A单机，沉浸式剧情、开放世界佳作持续更新</p>
                        <button onclick="window.open('https://gametogether1.github.io/mygame/', '_blank')"
                                class="px-6 py-3 rounded-full bg-neon hover:bg-opacity-90 transition-all duration-300 text-dark font-bold ripple flex items-center gap-2 w-fit">
                            立即探索 <i class="fa fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 外网ACG -->
            <div id="acg" class="card card-hover rounded-xl overflow-hidden h-[480px] glow hover:glow-secondary-hover" data-aos="fade-up" data-aos-delay="200" data-aos-duration="1000">
                <div class="relative h-full">
                    <img src="https://pic1.imgdb.cn/item/69d52039cfae5fcb267afbfe.png" alt="外网ACG" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 bg-card-overlay"></div>
                    <div class="absolute inset-0 flex flex-col justify-end p-8">
                        <h2 class="text-4xl font-bold mb-4 text-shadow">外网ACG</h2>
                        <p class="text-gray-300 mb-6">日系二次元、视觉小说、同人作品，每日更新海外优质ACG内容</p>
                        <button onclick="window.open('https://gametogether1.github.io/myacg/', '_blank')"
                                class="px-6 py-3 rounded-full bg-secondary hover:bg-opacity-90 transition-all duration-300 text-white font-bold ripple flex items-center gap-2 w-fit">
                            浏览ACG <i class="fa fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 复古模拟 -->
            <div id="retro" class="card card-hover rounded-xl overflow-hidden h-[480px] glow hover:glow-primary-hover" data-aos="fade-up" data-aos-delay="300" data-aos-duration="1000">
                <div class="relative h-full">
                    <img src="https://pic1.imgdb.cn/item/69cfa6a1df10edaed90f6f1e.jpg" alt="复古模拟" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 bg-card-overlay"></div>
                    <div class="absolute inset-0 flex flex-col justify-end p-8">
                        <h2 class="text-4xl font-bold mb-4 text-shadow">复古模拟</h2>
                        <p class="text-gray-300 mb-6">FC/GBA/PSP/NDS全平台模拟器，重温童年经典怀旧游戏</p>
                        <button onclick="window.open('https://gametogether1.github.io/myemu/', '_blank')"
                                class="px-6 py-3 rounded-full bg-primary hover:bg-opacity-90 transition-all duration-300 text-white font-bold ripple flex items-center gap-2 w-fit">
                            怀旧之旅 <i class="fa fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Switch掌机板块 -->
            <div id="switch" class="card switch-card card-hover rounded-xl overflow-hidden h-[480px] glow-switch hover:glow-switch-hover" data-aos="fade-up" data-aos-delay="400" data-aos-duration="1000">
                <div class="relative h-full">
                    <img src="https://pic1.imgdb.cn/i/034799geNpZb4oN6d1hNQg.jpg" alt="Switch掌机游戏" class="absolute inset-0 w-full h-full object-cover">
                    <div class="absolute inset-0 bg-card-overlay"></div>
                    <div class="absolute inset-0 flex flex-col justify-end p-8">
                        <h2 class="text-4xl font-bold mb-4 text-shadow-switch">Switch掌机</h2>
                        <p class="text-gray-300 mb-6">Switch独占大作、移植游戏、金手指资源，掌机爱好者专属专区</p>
                        <button onclick="window.open('https://gametogether1.github.io/myswitch/', '_blank')"
                                class="px-6 py-3 rounded-full bg-switch hover:bg-opacity-90 transition-all duration-300 text-white font-bold ripple flex items-center gap-2 w-fit">
                            进入专区 <i class="fa fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-darkLight py-8 px-6 md:px-12">
        <div class="container mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-6 md:mb-0">
                    <a href="#" class="flex items-center space-x-2">
                        <img src="https://pic1.imgdb.cn/item/69cfa72edf10edaed90f7072.png" alt="Logo" class="h-8 w-8 rounded">
                        <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-neon to-secondary">一块游戏</span>
                    </a>
                    <p class="text-gray-400 mt-2">单机 / ACG / 复古模拟 / Switch 一站式游戏平台</p>
                </div>

                <div class="flex space-x-6 text-2xl">
                    <a href="#" class="text-gray-400 hover:text-neon transition-colors duration-300">
                        <i class="fa fa-weixin"></i>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-neon transition-colors duration-300">
                        <i class="fa fa-twitter-square"></i>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-neon transition-colors duration-300">
                        <i class="fa fa-instagram"></i>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-neon transition-colors duration-300">
                        <i class="fa fa-youtube-play"></i>
                    </a>
                </div>
            </div>

            <div class="border-t border-gray-700 mt-8 pt-8 flex flex-col md:flex-row justify-between items-center">
                <p class="text-gray-400 text-sm mb-4 md:mb-0">© 2026 GameVerse. 保留所有权利。</p>
                <div class="flex space-x-6 text-sm">
                    <a href="#" class="text-gray-400 hover:text-neon transition-colors">隐私政策</a>
                    <a href="#" class="text-gray-400 hover:text-neon transition-colors">使用条款</a>
                    <a href="#" class="text-gray-400 hover:text-neon transition-colors">联系我们</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            AOS.init();

            document.querySelectorAll('a[href^="#"]').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('href');
                    const target = document.querySelector(targetId);
                    if (target) {
                        window.scrollTo({
                            top: target.offsetTop - 20,
                            behavior: 'smooth'
                        });
                    }
                });
            });

            gsap.from('h1', {y: 50, opacity: 0, duration: 1, delay: 0.2, ease: 'power3.out'});

            setTimeout(() => {
                const script = document.createElement('script');
                script.src = "https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js";
                script.onload = () => {
                    particlesJS('particles-js', {
                        particles: {
                            number: {value: 70},
                            color: {value: "#06b6d4"},
                            opacity: {value: 0.45, random: true},
                            size: {value: 3, random: true},
                            line_linked: {enable: true, distance: 140, color: "#06b6d4", opacity: 0.18},
                            move: {enable: true, speed: 0.9}
                        },
                        interactivity: {events: {onhover: {mode: "grab"}, onclick: {mode: "push"}}},
                        retina_detect: true
                    });
                }
                document.body.appendChild(script);
            }, 800);
        });
    </script>
</body>
</html>
